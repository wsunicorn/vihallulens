# E14 — bậc thang kích thước, mô hình đọc Qwen/Qwen2.5-1.5B-Instruct. Task T31.
#
# Câu hỏi của E14: phương pháp có chạy được trên phần cứng nhỏ hơn không, và mất bao nhiêu điểm
# khi thu mô hình đọc lại. Sau E13 nó còn mang thêm một câu nữa, đáng giá hơn: T30 đo được nhóm
# chunk-aware KHÔNG chuyển giữa Qwen2.5-7B và Sailor2-8B. Bậc thang này hỏi nó có chuyển giữa
# các cỡ của CÙNG một họ mô hình không — một phép thử nhẹ hơn hẳn.
#
# Mọi khóa ngoài model_name giữ y hệt e03_chunk_sentence_vihallu.yaml để phép so khác đúng một
# biến.

run_name: e14_qwen15b_vihallu

dataset:
  name: vihallu
  split_seed: 42

chunking:
  strategy: sentence
  min_words: 5

extractor:
  model_name: Qwen/Qwen2.5-1.5B-Instruct
  quantization: nf4
  max_context_tokens: 4096
  device: cuda
  # Nấc này chạy bfloat16, KHÁC hai nấc kia. Đây là ngoại lệ có chủ ý, quyết định ngày
  # 09/09/2026, không phải sơ suất.
  #
  # Đo ở T31 trên 20 mẫu: Qwen2.5-1.5B tràn số ở float16 trên TOÀN BỘ 28 lớp, 20/20 mẫu, hỏng
  # ngay từ lớp 0. Không phải một lớp yếu như lớp 27 của 7B, cũng không phải 0,70 % mẫu như
  # Sailor2 — không còn lớp nào để bỏ, không còn mẫu nào để bỏ. Ở float16 mô hình này không đọc
  # được, chấm hết.
  #
  # bfloat16 có cùng dải mũ với float32 nên không tràn ở chỗ float16 tràn. Cái giá: T4 là kiến
  # trúc Turing, không có bfloat16 gốc nên phải giả lập, chậm khoảng 4,1 lần (1.101 so với 271
  # ms/mẫu). Nghĩa là nấc lùi này ĐẮT HƠN GẤP ĐÔI nấc 3B mà nó lùi khỏi (513 ms ở float16).
  # Bậc thang lùi tồn tại để rẻ hơn; ở đây nó không rẻ hơn. Đó là một kết quả của E14.
  #
  # Hạn chế phải ghi khi viết Bảng 6: so nấc này với nấc 3B là để hai thứ khác nhau cùng lúc —
  # cỡ mô hình và kiểu số. Chống đỡ được một phần, vì bfloat16 trung thực hơn float16 nên nếu
  # 1.5B vẫn kém hơn thì đó là kết luận thận trọng chứ không phải do kiểu số làm hỏng. Riêng
  # phần "chunk-aware có hơn mốc lookback của chính nó không" thì không dính hạn chế này: mốc
  # dùng chung mô hình, chung kiểu số, chung shard.
  compute_dtype: bfloat16

  # !! PHẢI ĐIỀN TỪ SỐ ĐO, KHÔNG ĐƯỢC ĐOÁN !!
  #
  # Qwen2.5-7B hỏng đúng lớp 27 — lớp cuối — đo ở T07. Nhưng 1_5B là mô hình khác, số lớp
  # khác, nên lớp hỏng của nó là câu hỏi thực nghiệm riêng. T30 cho thấy chuyện này không suy
  # ra được: Sailor2 hỏng theo kiểu hoàn toàn khác Qwen.
  #
  # Ô dò kiểu số trong notebook đo trước rồi TỰ GHI ĐÈ danh sách này. Để trống ở đây là cố ý.
  exclude_layers: []

features:
  groups: [basic, chunk_aware, stability]
  head_aggregation: all

detector:
  type: logistic_regression
  class_weight: balanced
