# E03 — chunk-aware chia theo câu, trên ViHallu. Task T22.
#
# Đây là phần đóng góp của đề tài. Mốc phải vượt là macro-F1 0,7465 của E02, KHÔNG phải 0,6562
# của E01: chunk-aware và lookback gộp là cùng một họ phương pháp, chỉ khác cách chia mẫu số.
# Vượt E01 chỉ chứng minh chú ý có ích; vượt E02 mới chứng minh chia theo đoạn có ích.

run_name: e03_chunk_aware_sentence_vihallu

dataset:
  name: vihallu
  split_seed: 42

chunking:
  strategy: sentence
  min_words: 5            # câu ngắn hơn ngần này gộp vào câu trước, chốt ở T15

extractor:
  # Giống hệt E02 ở mọi khóa quyết định lượt chạy GPU, nên hai thí nghiệm DÙNG CHUNG một lượt
  # trích. Hash trích đặc trưng chỉ tính trên dataset, chunking và extractor.
  model_name: Qwen/Qwen2.5-7B-Instruct
  quantization: nf4
  max_context_tokens: 4096
  device: cuda
  compute_dtype: float16
  exclude_layers: [27]

features:
  # basic là tỷ lệ lookback gộp, tức chính E02. Giữ nó lại để câu hỏi được kiểm là "thêm hình
  # dạng vào lượng có tốt hơn không", chứ không phải "hình dạng một mình có hơn lượng một mình
  # không" — câu thứ hai thú vị nhưng không phải câu đề tài đặt ra.
  groups: [basic, chunk_aware, stability]
  # Chọn thật sự nằm ở script và quyết trên tập dev. Giá trị ở đây là mặc định khi không chọn.
  head_aggregation: all

detector:
  type: logistic_regression
  class_weight: balanced
