[project]
name = "vihallulens"
version = "0.1.0"
description = "Phát hiện ảo giác cho hệ thống RAG tiếng Việt bằng tín hiệu chú ý nội tại của LLM"
readme = "README.md"
# Máy phát triển của nhóm dùng đúng 3.11 theo mục 3 CLAUDE.md, nhưng Kaggle chạy 3.12 và
# không cho đổi. Chặn trên khiến `pip install -e .` hỏng ở mọi phiên GPU, mà không ngăn được
# gì: trọn bộ kiểm thử đã chạy xanh trên 3.12 của Kaggle ở T18.
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Nguyễn Ngọc Lân" },
    { name = "Nguyễn Tấn Minh" },
]

dependencies = [
    # Mô hình đọc và trích attention.
    #
    # transformers có trần major theo yêu cầu ở mục 5 CLAUDE.md: việc hook trên self_attn có
    # nhận được attn_weights hay không PHỤ THUỘC PHIÊN BẢN, và một bản major mới là đúng chỗ
    # hành vi đó đổi. Sàn là 5.0 vì đó là bản thấp nhất đã chạy thật (Kaggle, 06/09/2026); mã
    # nguồn được đo trên 5.15.0. Không ghim chặt một bản vì cả hai bản đều chưa được kiểm hết.
    #
    # Ghim ở đây KHÔNG bảo vệ được notebook: nó cài bằng `pip install --no-deps -e .` nên dùng
    # bản Kaggle có sẵn. Thứ bảo vệ thật là tests/test_attention_hook.py, và ô 4 của mỗi
    # notebook phải chạy nó trên chính môi trường sắp tiêu giờ GPU.
    "torch",
    "transformers>=5.0,<6",
    "accelerate",
    "bitsandbytes",
    # Dữ liệu
    "pandas",
    "pyarrow",
    "numpy",
    # Bộ phân loại và đánh giá
    "scikit-learn",
    # Cấu hình
    "pydantic",
    "pyyaml",
    "python-dotenv",
    # Truy xuất
    "rank-bm25",
    # Tách từ tiếng Việt — PhoBERT được huấn luyện trên văn bản đã tách từ, đưa văn bản thô
    # vào thì từ vựng không khớp lúc huấn luyện và điểm tụt. Chỉ PhoBERT cần; XLM-R và
    # InfoXLM dùng SentencePiece nên không. Chốt ở T18. Thư viện nhẹ, chỉ một mô hình CRF.
    "pyvi",
    # Dịch vụ
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vihallulens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, UP pyupgrade, B bugbear, SIM simplify, N naming
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.per-file-ignores]
# X for a feature matrix is the scikit-learn convention, and mục 2.4 docs/SPEC.md fixes the
# signature as fit(self, X, y). Renaming it would make the code read differently from every
# sklearn example a reader will compare it against.
"src/vihallulens/detect/*.py" = ["N803", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["vihallulens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
