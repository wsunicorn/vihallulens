[project]
name = "vihallulens"
version = "0.1.0"
description = "Phát hiện ảo giác cho hệ thống RAG tiếng Việt bằng tín hiệu chú ý nội tại của LLM"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [
    { name = "Nguyễn Ngọc Lân" },
    { name = "Nguyễn Tấn Minh" },
]

dependencies = [
    # Mô hình đọc và trích attention
    "torch",
    "transformers",
    "accelerate",
    "bitsandbytes",
    # Dữ liệu
    "pandas",
    "pyarrow",
    "numpy",
    # Bộ phân loại và đánh giá
    "scikit-learn",
    # Cấu hình
    "pydantic",
    "pyyaml",
    "python-dotenv",
    # Truy xuất
    "rank-bm25",
    # Dịch vụ
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vihallulens"]
