<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phiếu đánh giá</title>
<style>
:root {
  --paper: #fbfaf7; --card: #ffffff; --ink: #1d232b; --muted: #5c6673; --rule: #d9d6cd;
  --accent: #0f6b68; --accent-soft: #e2f0ee; --warn: #9a3412;
  --serif: Cambria, "Times New Roman", serif; --sans: "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.6 var(--sans); }
main { max-width: 900px; margin: 0 auto; padding: 16px 16px 96px; }
header { position: sticky; top: 0; background: var(--paper); border-bottom: 1px solid var(--rule); z-index: 2; }
.bar { max-width: 900px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.bar strong { font-family: var(--serif); font-size: 18px; }
.bar .grow { flex: 1; min-width: 120px; }
progress { width: 100%; height: 10px; accent-color: var(--accent); }
button { font: inherit; min-height: 44px; padding: 8px 14px; border: 1px solid var(--rule); border-radius: 8px;
  background: var(--card); color: var(--ink); cursor: pointer; text-align: left; }
button:hover { border-color: var(--accent); }
button:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
button.main { background: var(--accent); color: #fff; border-color: var(--accent); }
section.card { background: var(--card); border: 1px solid var(--rule); border-radius: 10px; padding: 16px 18px; margin-top: 14px; }
h2 { font: 600 14px/1.3 var(--sans); color: var(--muted); margin: 0 0 6px; }
.context { font-family: var(--serif); white-space: pre-wrap; }
.claim { font-family: var(--serif); font-size: 19px; border-left: 4px solid var(--accent); padding-left: 12px; }
.options { display: grid; gap: 8px; }
.options small { color: var(--muted); display: block; }
button[aria-pressed="true"] small { color: #dbeeec; }
.key { display: inline-block; min-width: 1.6em; text-align: center; border: 1px solid currentColor; border-radius: 5px;
  font-size: 13px; margin-right: 8px; opacity: .75; }
textarea { width: 100%; min-height: 60px; font: inherit; border: 1px solid var(--rule); border-radius: 8px; padding: 8px; }
.nav { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
.note { color: var(--muted); font-size: 15px; }
.warn { color: var(--warn); }
[hidden] { display: none !important; }
table { border-collapse: collapse; width: 100%; font-size: 15px; } td, th { border: 1px solid var(--rule); padding: 6px 8px; text-align: left; vertical-align: top; }
</style>
</head>
<body>
<header><div class="bar">
  <strong id="title"></strong>
  <div class="grow"><progress id="progress" value="0" max="1" aria-label="Tiến độ"></progress></div>
  <span id="count" class="note"></span>
  <button id="export" type="button">Xuất CSV</button>
</div></header>
<main>
  <details class="card" id="guide"><summary><b>Hướng dẫn (đọc hết trước khi bắt đầu)</b></summary><div id="guideText"></div></details>
  <section class="card"><h2>Ngữ cảnh</h2><div class="context" id="context"></div></section>
  <section class="card" id="questionCard"><h2>Câu hỏi của người dùng</h2><div id="question"></div></section>
  <section class="card"><h2 id="claimTitle"></h2><div class="claim" id="claim"></div></section>
  <section class="card" id="answers"></section>
  <section class="card"><h2>Ghi chú (không bắt buộc, nên ghi khi phân vân)</h2><textarea id="note"></textarea>
    <p class="note warn" id="feedback" hidden></p></section>
  <div class="nav">
    <button id="prev" type="button">← Trước</button>
    <button id="next" type="button" class="main">Tiếp → (Enter)</button>
    <button id="todo" type="button">Đến câu chưa làm</button>
  </div>
  <p class="note">Phiếu tự lưu trên trình duyệt này. Làm xong bấm <b>Xuất CSV</b> rồi gửi tệp tải về. Không trao đổi với người kia cho tới khi cả hai làm xong.</p>
</main>
<script>
const FORM = /*DATA*/null;
const KEY = "phieu-" + FORM.id;
let state = {};
try { state = JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { state = {}; }
let at = Math.max(0, FORM.rows.findIndex(r => !isDone(r)));
const $ = id => document.getElementById(id);
function answer(r) { return state[r.sample_id] || (state[r.sample_id] = {}); }
function visible(q, a) { return !q.when || a[q.when.key] === q.when.value; }
function isDone(r) { const a = state[r.sample_id] || {}; return FORM.questions.every(q => !visible(q, a) || a[q.key]); }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { alert("Trình duyệt không cho lưu. Hãy xuất CSV thường xuyên."); } }
function draw() {
  const r = FORM.rows[at], a = answer(r);
  $("title").textContent = FORM.title;
  const done = FORM.rows.filter(isDone).length;
  $("progress").max = FORM.rows.length; $("progress").value = done;
  $("count").textContent = `Câu ${at + 1}/${FORM.rows.length}, đã xong ${done}`;
  $("context").textContent = r.context;
  $("questionCard").hidden = !r.question; $("question").textContent = r.question || "";
  $("claimTitle").textContent = FORM.claimTitle; $("claim").textContent = r.claim;
  $("note").value = a.ghi_chu || "";
  const box = $("answers"); box.textContent = "";
  let number = 0;
  FORM.questions.forEach(q => {
    if (!visible(q, a)) return;
    const h = document.createElement("h2"); h.textContent = q.text; h.style.marginTop = number ? "16px" : "0"; box.append(h);
    const g = document.createElement("div"); g.className = "options"; g.setAttribute("role", "group"); box.append(g);
    (r.options && r.options[q.key] || q.options).forEach(o => {
      number += 1;
      const b = document.createElement("button"); b.type = "button"; b.dataset.number = number;
      b.setAttribute("aria-pressed", String(a[q.key] === o.value));
      const k = document.createElement("span"); k.className = "key"; k.textContent = number; b.append(k, o.label);
      if (o.hint) { const s = document.createElement("small"); s.textContent = o.hint; b.append(s); }
      b.onclick = () => { a[q.key] = o.value; FORM.questions.forEach(x => { if (!visible(x, a)) delete a[x.key]; });
        a.luc = new Date().toISOString(); save(); draw(); };
      g.append(b);
    });
  });
  const f = $("feedback"); f.hidden = true;
  if (FORM.practice && isDone(r) && r.key) {
    const ok = FORM.questions.every(q => !r.key[q.key] || a[q.key] === r.key[q.key]);
    f.hidden = false; f.textContent = ok ? "Đúng với đáp án luyện tập." : "Khác đáp án luyện tập: " + r.explain;
  }
}
function go(step) { const n = at + step; if (n >= 0 && n < FORM.rows.length) { at = n; draw(); scrollTo(0, 0); } }
$("note").oninput = e => { answer(FORM.rows[at]).ghi_chu = e.target.value; save(); };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("todo").onclick = () => { const i = FORM.rows.findIndex(r => !isDone(r)); if (i >= 0) { at = i; draw(); scrollTo(0, 0); } else alert("Đã làm hết."); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "Enter" && e.target.tagName !== "BUTTON" && e.target.tagName !== "SUMMARY") { e.preventDefault(); go(1); }
  const b = document.querySelector(`#answers button[data-number="${e.key}"]`); if (b) b.click();
});
$("export").onclick = () => {
  const cols = ["sample_id", ...FORM.questions.map(q => q.key), "ghi_chu", "luc"];
  const cell = v => '"' + String(v || "").replace(/"/g, '""') + '"';
  const lines = [cols.join(","), ...FORM.rows.map(r => cols.map(c => cell(c === "sample_id" ? r.sample_id : answer(r)[c])).join(","))];
  const left = FORM.rows.filter(r => !isDone(r)).length;
  if (left && !confirm(`Còn ${left} câu chưa làm. Vẫn xuất?`)) return;
  const url = URL.createObjectURL(new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8" }));
  const link = document.createElement("a"); link.href = url; link.download = FORM.id + ".csv"; link.click(); URL.revokeObjectURL(url);
};
$("guideText").innerHTML = FORM.guide; $("guide").open = !Object.keys(state).length;
draw();
</script>
</body>
</html>
